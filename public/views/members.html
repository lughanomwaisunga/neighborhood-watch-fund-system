<body>
    <div class="container">
        <header>
            <h1><?php echo APP_NAME; ?></h1>
            <nav>
                <ul>
                    <li><a href="/">Dashboard</a></li>
                    <li><a href="/members">Members</a></li>
                    <li><a href="/payments">Payments</a></li>
                    <li><a href="/statements">Statements</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section class="members-section">
                <h2>Member Registration</h2>
                <form id="memberForm" class="form">
                    <div class="form-group">
                        <label for="plotNumber">Plot Number *</label>
                        <input type="text" id="plotNumber" name="plot_number" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">First Name *</label>
                            <input type="text" id="firstName" name="first_name" required>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Last Name *</label>
                            <input type="text" id="lastName" name="last_name" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone" name="phone_number" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="tier">Contribution Tier *</label>
                            <select id="tier" name="contribution_tier" required>
                                <option value="">Select Tier</option>
                                <option value="standard">Standard (KES 50/month)</option>
                                <option value="premium">Premium (KES 100/month)</option>
                                <option value="vip">VIP (KES 200/month)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="amountDue">Amount Due *</label>
                            <input type="number" id="amountDue" name="amount_due" step="0.01" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Register Member</button>
                </form>
            </section>

            <section class="members-section">
                <h2>Members List</h2>
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search members..." class="search-input">
                </div>
                <table class="table" id="membersTable">
                    <thead>
                        <tr>
                            <th>Plot Number</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Tier</th>
                            <th>Amount Due</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 <?php echo APP_NAME; ?>. All rights reserved.</p>
        </footer>
    </div>

    <script src="/js/script.js"></script>
    <script>
        // Load members
        function loadMembers() {
            fetch('/members')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.querySelector('#membersTable tbody');
                    tbody.innerHTML = '';
                    data.members.forEach(member => {
                        const row = `
                            <tr>
                                <td>${member.plot_number}</td>
                                <td>${member.first_name} ${member.last_name}</td>
                                <td>${member.email}</td>
                                <td>${member.phone_number}</td>
                                <td>${member.contribution_tier}</td>
                                <td>KES ${parseFloat(member.amount_due).toFixed(2)}</td>
                                <td><span class="badge badge-${member.status}">${member.status}</span></td>
                                <td>
                                    <a href="/members/${member.member_id}" class="btn btn-sm">View</a>
                                </td>
                            </tr>
                        `;
                        tbody.innerHTML += row;
                    });
                })
                .catch(error => console.error('Error loading members:', error));
        }

        // Form submission
        document.getElementById('memberForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            fetch('/members/create', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Member registered successfully!');
                    this.reset();
                    loadMembers();
                } else {
                    alert('Error: ' + (data.error || 'Registration failed'));
                }
            })
            .catch(error => console.error('Error:', error));
        });

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function() {
            const query = this.value;
            if (query.length > 2) {
                fetch('/members/search?q=' + encodeURIComponent(query))
                    .then(response => response.json())
                    .then(data => {
                        const tbody = document.querySelector('#membersTable tbody');
                        tbody.innerHTML = '';
                        data.members.forEach(member => {
                            const row = `
                                <tr>
                                    <td>${member.plot_number}</td>
                                    <td>${member.first_name} ${member.last_name}</td>
                                    <td>${member.email}</td>
                                    <td>${member.phone_number}</td>
                                    <td>${member.contribution_tier}</td>
                                    <td>KES ${parseFloat(member.amount_due).toFixed(2)}</td>
                                    <td><span class="badge badge-${member.status}">${member.status}</span></td>
                                    <td>
                                        <a href="/members/${member.member_id}" class="btn btn-sm">View</a>
                                    </td>
                                </tr>
                            `;
                            tbody.innerHTML += row;
                        });
                    })
                    .catch(error => console.error('Error:', error));
            } else {
                loadMembers();
            }
        });

        // Initial load
        loadMembers();
    </script>
</body>
</html>
